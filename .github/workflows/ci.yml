# Why this file exists: proves this service satisfies the shared contract on
# every push. It runs the Python tests, then runs the SAME contract suite that
# the Next.js and Go implementations pass, against this service, using a
# throwaway Postgres whose schema comes from the pinned contract version.
name: CI
on: [push, pull_request]

env:
  # The one line to change to adopt a newer contract version.
  CONTRACT_REPO: kmonagle/resume_nextjs
  CONTRACT_REF: contract-v1
  TEST_TOKEN: ci-token-0123456789abcdef

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: dev, POSTGRES_DB: links }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

      # The contract lives in the Next.js repo, pinned to a tag.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTRACT_REPO }}
          ref: ${{ env.CONTRACT_REF }}
          path: contract

      # This service never migrates; create the tables from the pinned SQL.
      - name: Apply the contract's migrations
        run: |
          for f in contract/drizzle/*.sql; do
            psql "postgres://postgres:dev@localhost:5432/links" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Start this service
        run: |
          DATABASE_URL="postgres://postgres:dev@localhost:5432/links" \
            LINK_BACKEND_TOKEN="$TEST_TOKEN" \
            uvicorn app.main:create_app --factory --port 8080 &
          # Wait (up to 30s) until it answers.
          for i in $(seq 30); do
            curl -sf http://localhost:8080/meta && exit 0
            sleep 1
          done
          echo "service did not start" && exit 1

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Contract tests against this service
        working-directory: contract
        env:
          CONTRACT_BASE_URL: http://localhost:8080
          CONTRACT_IDENTITY: header # remote backends: X-Owner-Id + bearer token
          CONTRACT_API_PREFIX: ""    # routes are /links, not /api/links
          CONTRACT_TOKEN: ${{ env.TEST_TOKEN }}
        run: |
          npm ci
          npm run test:contract

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t resume-python .
